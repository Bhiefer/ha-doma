# Google Apps Script čte tři listy HA dat; všech 17 entit sdílí jeden požadavek.
# Interval 6 hodin zachovává původní nastavení. URL s tokenem patří do secrets.yaml.
# Neplatná odpověď a chybějící cena znamenají unavailable, nikdy náhradní nulu.
# Skladová nedostupnost je atribut nabídky; sama nemaže její doloženou cenu.
- resource: !secret fuel_prices_api_url
  scan_interval: 21600
  timeout: 30
  sensor:
    - name: "Ceny paliv API"
      unique_id: ceny_paliv_api
      availability: >-
        {{ value_json is defined and value_json is mapping
           and value_json.get('ok') is sameas true
           and value_json.get('generated_at') is string
           and value_json.get('items') is mapping }}
      value_template: >-
        {{ value_json.get('generated_at') if value_json is defined
           and value_json is mapping else none }}
      json_attributes:
        - items
        - pellets
        - ruf
        - valcove

    # Nové entity mají očekávané ID sensor.ceny_paliv_<klíč nabídky>.
    # Po prvním načtení ověřit přidělená ID v registru HA proti dashboardu.
    - name: "Ceny paliv evans"
      unique_id: ceny_paliv_evans
      unit_of_measurement: "Kč/kg"
      state_class: measurement
      availability: >-
        {%- set payload = value_json if value_json is defined and value_json is mapping else {} -%}
        {%- set items = payload.get('items') -%}
        {%- set item = items.get('evans') if items is mapping else none -%}
        {%- set price = item.get('price_per_kg') if item is mapping else none -%}
        {{ payload.get('ok') is sameas true and price is number
           and price is not boolean and is_number(price) }}
      value_template: >-
        {%- set payload = value_json if value_json is defined and value_json is mapping else {} -%}
        {%- set items = payload.get('items') -%}
        {%- set item = items.get('evans') if items is mapping else none -%}
        {%- set price = item.get('price_per_kg') if item is mapping else none -%}
        {{ price if payload.get('ok') is sameas true and price is number
           and price is not boolean and is_number(price) else none }}
      json_attributes_path: "$.items.evans"
      json_attributes: &ceny_paliv_atributy
        - seller
        - change_10d_per_kg
        - status
        - checked_at
        - source

