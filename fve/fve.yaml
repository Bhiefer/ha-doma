input_number:
  fve_denni_spotreba_prumerna_vsedni:
    name: "FVE Denní spotřeba průměrná všední dny"
    min: 10
    max: 100
    step: 1
    mode: box
    unit_of_measurement: kWh
  fve_denni_spotreba_prumerna_vikend:
    name: "FVE Denní spotřeba průměrná víkend"
    min: 10
    max: 100
    step: 1
    mode: box
    unit_of_measurement: kWh
  fve_baterie_kapacita:
    name: "FVE Baterie kapacita"
    min: 1000
    max: 20000
    step: 10
    mode: box
    unit_of_measurement: Wh
  spot_cena_nizky_tarif:
    name: "Spot cena"
    min: 10
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: kWh
  # Pokud cena dosáhne hranice pod koeficient*dlouhodobý průměr, začne se topit energií ze sítě
  spot_koeficient_ceny_topeni:
    name: "Koeficient ceny topení"
    min: 30
    max: 300
    step: 5
    mode: slider
    unit_of_measurement: "%"
  # Pokud cena dosáhne hranice pod koeficient*dlouhodobý průměr, začne se nabíjet baterie ze sítě
  spot_koeficient_ceny_fve:
    name: "Koeficient ceny FVE"
    min: 30
    max: 300
    step: 5
    mode: slider
    unit_of_measurement: "%"
  # Pokud cena dosáhne hranice pod koeficient*dlouhodobý průměr, začne se nabíjet auto ze sítě
  spot_koeficient_ceny_auto:
    name: "Koeficient ceny auto"
    min: 30
    max: 300
    step: 5
    mode: slider
    unit_of_measurement: "%"
  fve_auto_nabijeci_vykon:
    name: "Nabíjecí výkon"
    min: 10
    max: 32
    step: 1
    mode: slider
    unit_of_measurement: "A"
counter:
  fve_celkova_spotreba_pocitadlo_dni_workday:
    initial: 0
    step: 1
  fve_celkova_spotreba_pocitadlo_dni_holiday:
    initial: 0
    step: 1
utility_meter:
  fve_celkova_spotreba_hodinova:
    source: sensor.fve_celkova_spotreba
    cycle: hourly
  fve_celkova_spotreba_denni:
    source: sensor.fve_celkova_spotreba
    cycle: daily
  fve_celkova_spotreba_tarify:
    source: sensor.fve_celkova_spotreba
    tariffs:
      - workday
      - holiday
  fve_hodinova:
    source: sensor.goodwe_total_pv_generation
    cycle: hourly
  fve_denni:
    source: sensor.goodwe_total_pv_generation
    cycle: daily
sensor:
  - platform: integration
    source: sensor.goodwe_house_consumption
    name: "FVE Celková spotřeba"
    unit_prefix: k
    round: 1
    method: left
  - platform: filter
    name: "Spot Cena elektřiny průměrná 24h"
    entity_id: sensor.current_spot_electricity_price
    filters:
      - filter: outlier
        window_size: 3
        radius: 2.0
      - filter: time_simple_moving_average
        window_size: "24:00"
        precision: 2
  - platform: history_stats
    name: spot_podprumerna_cena_fve_on_stats
    entity_id: binary_sensor.spot_podprumerna_cena_fve
    state: "on"
    type: ratio
    end: "{{ today_at('00:00') }}"
    duration:
      days: 14
  - platform: history_stats
    name: spot_podprumerna_cena_topeni_on_stats
    entity_id: binary_sensor.spot_podprumerna_cena_topeni
    state: "on"
    type: ratio
    end: "{{ today_at('00:00') }}"
    duration:
      days: 14
  - platform: history_stats
    name: spot_podprumerna_cena_auto_on_stats
    entity_id: binary_sensor.spot_podprumerna_cena_auto
    state: "on"
    type: ratio
    end: "{{ today_at('00:00') }}"
    duration:
      days: 14
  - platform: statistics
    name: "FVE Car Power Available Average"
    entity_id: sensor.fve_car_power_available
    state_characteristic: mean
    keep_last_sample: true
    max_age:
      minutes: 20
template:
  - sensor:
      # Migrace starších šablon zachovává ID, názvy, jednotky a výpočty;
      # podmínky dostupnosti a ochranné limity zůstávají beze změny.
      - default_entity_id: sensor.fve_car_power_available
        name: "FVE Car Power Available"
        unit_of_measurement: "W"
        device_class: power
        state: >
          {% if is_state('binary_sensor.fve_auto_nabijeni', 'off') %} 
            {% set sit = states('sensor.goodwe_active_power') | float(0) %}
          {% else %}
            {% set sit = states('sensor.goodwe_active_power') | float(0) + (states('input_number.fve_auto_nabijeci_vykon') | float(1) * 230) %}
          {% endif %}

          {{ sit if sit > 0 else 0 }}

      - default_entity_id: sensor.spot_koeficient_ze_site_auto
        name: "Spot Koeficient odběru ze sítě pro nabíjení auta"
        unit_of_measurement: "%"
        state: >
          {% set car_charge_koeficient = 1 - (states('sensor.fve_car_power_available_average') | float(0) / (states('input_number.fve_auto_nabijeci_vykon') | float(1) * 230)) %}

          {{  (car_charge_koeficient * 100 )| int if car_charge_koeficient > 0 else 0 | int }}

      - default_entity_id: sensor.spot_cena_dynamicka_auto
        name: "Spot Dynamická cena elektřiny pro nabíjení auta"
        unit_of_measurement: "CZK"
        state: >
          {{ states('sensor.spot_koeficient_ze_site_auto') | float(0) / 100 * states('sensor.current_spot_electricity_price') | float(0) }}

      - default_entity_id: sensor.spot_cena_elektriny_prumerna_24h_predikce
        name: "Spot Cena elektřiny průměrná 24h s predikcí"
        state: >
          {% set ns = namespace(total=0, count=0, additional_value=0, current_time=now(), timestamp=none) %}

          {% for key, value in states.sensor.current_spot_electricity_price.attributes.items() %}
            {% if key not in ['unit_of_measurement', 'icon', 'friendly_name'] %}
              {% set ns.timestamp = as_datetime(key) %}
              {% if ns.timestamp > ns.current_time %}
                {% if value is number %}
                  {% set ns.total = ns.total + value %}
                  {% set ns.count = ns.count + 1 %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}

          {# Přidání hodnoty senzoru spot_cena_elektriny_prumerna_24h 24krát #}
          {% set ns.additional_value = states('sensor.spot_cena_elektriny_prumerna_24h') | float(0) %}
          {% if ns.additional_value != 0 %}
            {% set ns.total = ns.total + (ns.additional_value * 24) %}
            {% set ns.count = ns.count + 24 %}
          {% endif %}

          {% if ns.count > 0 %}
            {{ (ns.total / ns.count) | round(2) }}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "Kč/kWh"

      - default_entity_id: sensor.fve_celkova_spotreba_prumerna_vsedni_den
        name: "FVE Denní spotřeba ve všední dny"
        unit_of_measurement: "kWh"
        state: >
          {% set days = states('counter.fve_celkova_spotreba_pocitadlo_dni_workday') | int %}
          {% set total = states('sensor.fve_celkova_spotreba_tarify_workday') | float %}
          {% if days > 0 %}
            {{ (total / days) | round(2) }}
          {% else %}
            0
          {% endif %}
      - default_entity_id: sensor.fve_celkova_spotreba_prumerna_vikend
        name: "FVE Denní spotřeba o víkendech"
        unit_of_measurement: "kWh"
        state: >
          {% set days = states('counter.fve_celkova_spotreba_pocitadlo_dni_holiday') | int %}
          {% set total = states('sensor.fve_celkova_spotreba_tarify_holiday') | float %}
          {% if days > 0 %}
            {{ (total / days) | round(2) }}
          {% else %}
            0
          {% endif %}
      #   cena_elektriny_silova:
      #     friendly_name: "Cena silové elektřiny"
      #     value_template: >-
      #         {% set CURRENT_PRICE = states("sensor.current_spot_electricity_price") | float(0) %}
      #         {% set STROP = 5 | float %}
      #         {% if CURRENT_PRICE>STROP %}
      #           {{STROP}}
      #         {%- else -%}
      #           {{CURRENT_PRICE}}
      #         {%- endif %}
      #     # {% set STROP = 6.05 | float %}
      #     unit_of_measurement: "Kč/kWh"
      - default_entity_id: sensor.spot_cena_elektriny_distribuce
        name: "Cena distribuce elektřiny"
        state: >-
          {% if is_state('binary_sensor.spot_nizky_tarif', 'on') %}
            {{0.174 | float}}
          {% else %}
            {{0.2 | float}}
          {% endif %}
        unit_of_measurement: "Kč/kWh"
      - default_entity_id: sensor.spot_cena_limit_fve
        name: "Limit ceny elektřiny FVE"
        state: >-
          {% set cena = states('input_number.spot_koeficient_ceny_fve') | float(0) * states('sensor.spot_cena_elektriny_prumerna_24h_predikce') | float(0) * 0.01 %}
          {% if cena < 0.5 | float  %}
            {{0.5 | float }}
          {% else %}
            {{cena | float }}
          {% endif %}
        unit_of_measurement: "Kč/kWh"
      - default_entity_id: sensor.spot_cena_limit_topeni
        name: "Limit ceny elektřiny topení"
        state: >-
          {% set cena = states('input_number.spot_koeficient_ceny_topeni') | float(0) * states('sensor.spot_cena_elektriny_prumerna_24h_predikce') | float(0) * 0.01 %}
          {% if cena < 0.5 | float  %}
            {{0.5 | float }}
          {% else %}
            {{cena | float }}
          {% endif %}
        unit_of_measurement: "Kč/kWh"
      - default_entity_id: sensor.spot_cena_limit_auto
        name: "Limit ceny elektřiny auto"
        state: >-
          {% set cena = states('input_number.spot_koeficient_ceny_auto') | float(0) * states('sensor.spot_cena_elektriny_prumerna_24h_predikce') | float(0) * 0.01 %}
          {% if cena < 0.5 | float  %}
            {{0.5 | float }}
          {% else %}
            {{cena | float }}
          {% endif %}
        unit_of_measurement: "Kč/kWh"
      - default_entity_id: sensor.fve_baterie_stav
        name: "FVE Baterie Stav"
        state: >-
          {% set MODE = states("sensor.goodwe_battery_mode_code") | int(1) %}
          {% if MODE == 3 | int  %}
            Nabíjení
          {% elif MODE == 2 | int  %}
            Vybíjení
          {% elif MODE == 1 | int  %}
            Nečinný
          {%- else -%}
            Neznámý
          {%- endif %}
      - default_entity_id: sensor.fve_denni_spotreba_prumerna
        name: "FVE Denní spotřeba průměrná"
        unit_of_measurement: "kWh"
        state: >-
          {{ states('sensor.fve_celkova_spotreba_prumerna_vsedni_den') if is_state('binary_sensor.pracovni_den', 'on') else states('sensor.fve_celkova_spotreba_prumerna_vikend') }}
      - default_entity_id: sensor.fve_dnes_k_nabiti
        name: "FVE Dnes k nabití"
        unit_of_measurement: "kWh"
        state: >-
          {% set denni = states('sensor.fve_denni_spotreba_prumerna') | float(0) %}
          {{ denni - states('sensor.fve_celkova_spotreba_denni') | float(0) 
           - states('sensor.energy_production_today_remaining') | float(0) 
           - states('sensor.fve_baterie_nabito') | float(0)  }}
      #   fve_dnes_jeste_nasviti:
      #     friendly_name: "FVE Dnes ještě nasvítí"
      #     unit_of_measurement: "kWh"
      #     value_template: >-
      #       {{ [states('sensor.energy_production_today') | float(0)*0.8 - states('sensor.fve_denni') | float(0) , 0] | max }}
      - default_entity_id: sensor.fve_baterie_nabito
        name: "FVE Baterie Nabito"
        unit_of_measurement: "kWh"
        availability: >-
          {% set soc = states('sensor.goodwe_battery_state_of_charge') | float(none) %}
          {% set kapacita = states('input_number.fve_baterie_kapacita') | float(none) %}
          {{ is_number(soc) and is_number(kapacita)
             and 0 <= soc <= 100 and kapacita > 0 }}
        state: >-
          {% set soc = states('sensor.goodwe_battery_state_of_charge') | float(none) %}
          {% set kapacita = states('input_number.fve_baterie_kapacita') | float(none) %}
          {% if is_number(soc) and is_number(kapacita)
                and 0 <= soc <= 100 and kapacita > 0 %}
            {# Energie dostupná nad rezervou 20 % celkové kapacity. #}
            {{ (kapacita * ([soc - 20, 0] | max) / 100000) | round(3) }}
          {% else %}
            {{ none }}
          {% endif %}
      - default_entity_id: sensor.goodwe_baterie_stav
        name: goodwe_baterie_stav
        state: >-
          {% set stav = states('sensor.goodwe_battery_mode_code') | int(0) %}
          {% if stav == 1 %}
            Nenabíjí
          {% elif stav == 2 %}
            Vybíjení
          {% elif stav == 3 %}
            Nabíjení
          {%- else -%}
            Neznámý
          {%- endif %}
      - default_entity_id: sensor.goodwe_baterie_vykon
        name: goodwe_baterie_vykon
        state: >-
          {% set stav = states('sensor.goodwe_battery_mode_code') | int(0) %}
          {% if stav == 1 %}
            {{ 0 | int() }}
          {% elif stav == 2 %}
            {{ states('sensor.goodwe_battery_power') | int(0) }}
          {% elif stav == 3 %}
            {{ states('sensor.goodwe_battery_power') | int(0) * (-1) }}
          {%- else -%}
            {{ 0 | int() }}
          {%- endif %}
        unit_of_measurement: "W"
      - default_entity_id: sensor.goodwe_mod_nabijeni
        name: goodwe_mod_nabijeni
        state: >-
          {% set stav = states('select.goodwe_inverter_operation_mode') %}
          {% if stav == "general" %}
            Ze slunce
          {% elif stav == "eco_charge" %}
            Ze sítě
          {%- else -%}
            Neznámý
          {%- endif %}
  - binary_sensor:
      # Migrace ze starší platformy template zachovává podmínky vybíjení
      # i ID entity používané automatizací pro nastavení hloubky vybití.
      - default_entity_id: binary_sensor.fve_vybijeni_baterie
        name: fve_vybijeni_baterie
        state: "{{ not(is_state('binary_sensor.fve_nabijeni_ze_site', 'on') or (is_state('binary_sensor.spot_podprumerna_cena_topeni', 'on') and is_state('input_boolean.fve_topeni_na_baterii', 'off'))) }}"
      # Ostatní binární šablony FVE používají stejný moderní blok;
      # zachováváme cenové podmínky, dostupnost a časové hranice.
      - default_entity_id: binary_sensor.fve_nabijeni_ze_site
        name: fve_nabijeni_ze_site
        state: "{{ states('sensor.goodwe_battery_state_of_charge') | float(0) < 90 and is_state('binary_sensor.spot_podprumerna_cena_fve', 'on') and states('sensor.energy_current_hour') | float(0) < 1.0}}"
      - default_entity_id: binary_sensor.fve_dostatecne_nabito
        name: fve_dostatecne_nabito
        state: "{{ states('sensor.fve_dnes_k_nabiti') | float(0) < 0}}"
      - default_entity_id: binary_sensor.spot_nejlevnejsi_hodina
        name: "Spot Nejlevnější hodina"
        state: >-
          {{ now().hour == state_attr('sensor.spot_cheapest_electricity_today', 'hour') | int(0) }}
      - default_entity_id: binary_sensor.spot_nejdrazsi_hodina
        name: "Spot Nejdražší hodina"
        state: >-
          {{ now().hour == state_attr('sensor.spot_most_expensive_electricity_today', 'hour') | int(0) }}
      - default_entity_id: binary_sensor.spot_podprumerna_cena_fve
        name: spot_podprumerna_cena_fve
        availability: >-
          {{ is_number(states('sensor.current_spot_electricity_price'))
             and is_number(states('sensor.spot_cena_limit_fve')) }}
        state: >-
          {% set cena = states('sensor.current_spot_electricity_price') | float(none) %}
          {% set limit = states('sensor.spot_cena_limit_fve') | float(none) %}
          {{ cena is not none and limit is not none and cena < limit }}
      - default_entity_id: binary_sensor.spot_podprumerna_cena_topeni
        name: spot_podprumerna_cena_topeni
        state: "{{ states('sensor.current_spot_electricity_price') | float(0) < states('sensor.spot_cena_limit_topeni') | float(0) }}"
      - default_entity_id: binary_sensor.spot_podprumerna_cena_auto
        name: spot_podprumerna_cena_auto
        state: "{{ states('sensor.spot_cena_dynamicka_auto') | float(0) < states('sensor.spot_cena_limit_auto') | float(0) }}"
      - default_entity_id: binary_sensor.spot_nizky_tarif
        name: "Spot Nízký tarif"
        state: >-
          {% set state = now() %}
          {{ today_at('00:00') < state  < today_at('6:00') or today_at('19:00') < state < today_at('21:00') }}
automation:
  - alias: "FVE - Workaround aktualizace koeficientů"
    trigger:
      - platform: state
        entity_id: input_number.spot_koeficient_ceny_fve
      - platform: state
        entity_id: input_number.spot_koeficient_ceny_auto
      - platform: state
        entity_id: input_number.spot_koeficient_ceny_topeni
    action:
      - service: homeassistant.update_entity
        target:
          entity_id: sensor.spot_cena_elektriny_prumerna_24h_predikce

  - alias: FVE - Spotřeba Typ dne
    description: ""
    trigger:
      - platform: state
        entity_id: binary_sensor.pracovni_den
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.pracovni_den
                state: "on"
            sequence:
              - service: select.select_option
                data:
                  option: "workday"
                target:
                  entity_id: select.fve_celkova_spotreba_tarify
        default:
          - service: select.select_option
            data:
              option: "holiday"
            target:
              entity_id: select.fve_celkova_spotreba_tarify
  - alias: FVE - Spotřeba Počítadla dní
    description: ""
    trigger:
      - platform: time
        at: "00:00:01"
    condition: []
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.pracovni_den
                state: "on"
            sequence:
              - service: counter.increment
                target:
                  entity_id: counter.fve_celkova_spotreba_pocitadlo_dni_workday
        default:
          - service: counter.increment
            target:
              entity_id: counter.fve_celkova_spotreba_pocitadlo_dni_holiday
    mode: single

recorder:
  exclude:
    entity_globs:
      - sensor.goodwe_*
  include:
    entities:
      - sensor.goodwe_pv_power
      - sensor.goodwe_house_consumption
      - sensor.goodwe_battery_state_of_charge
      - sensor.goodwe_battery_mode
      - sensor.goodwe_battery_mode_code
      - sensor.goodwe_battery_power
      - sensor.goodwe_total_battery_discharge
      - sensor.goodwe_total_battery_charge
      - sensor.goodwe_total_pv_generation
      - sensor.goodwe_meter_total_energy_import
      - sensor.goodwe_meter_total_energy_export
      - sensor.goodwe_meter_total_energy_import_cost
      - sensor.goodwe_meter_total_energy_export_compensation
